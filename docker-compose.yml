services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poetry-quiz-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: poetry-quiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poetry_quiz
      POSTGRES_USER: poetry_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poetry_user -d poetry_quiz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
